name: order-processing

x-app: &app
  restart: unless-stopped
  depends_on:
    postgres:
      condition: service_healthy
    kafka-init:
      condition: service_completed_successfully
  environment: &app-env
    DB_USER: ${DB_USER:-orders}
    DB_PASSWORD: ${DB_PASSWORD:-orders}
    KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    KAFKA_CONSUMER_CONCURRENCY: ${KAFKA_CONSUMER_CONCURRENCY:-3}

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: order_processing
      POSTGRES_USER: ${DB_USER:-orders}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-orders}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-orders} -d order_processing"]
      interval: 5s
      timeout: 5s
      retries: 12

  kafka:
    image: apache/kafka:3.9.1
    ports:
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,PLAINTEXT_HOST://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 20

  kafka-init:
    image: apache/kafka:3.9.1
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        for topic in new_orders payed_orders sent_orders new_orders.DLT payed_orders.DLT sent_orders.DLT; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic $$topic --partitions ${KAFKA_PARTITIONS:-6} --replication-factor 1
        done

  order-service:
    <<: *app
    build:
      context: .
      args: { MODULE: order-service }
    environment:
      <<: *app-env
      DB_URL: jdbc:postgresql://postgres:5432/order_processing?currentSchema=orders_service
      SERVER_PORT: 8080
    ports: ["8081:8080"]

  payment-service:
    <<: *app
    build:
      context: .
      args: { MODULE: payment-service }
    environment:
      <<: *app-env
      DB_URL: jdbc:postgresql://postgres:5432/order_processing?currentSchema=payment_service
      SERVER_PORT: 8080
    ports: ["8082:8080"]

  shipping-service:
    <<: *app
    build:
      context: .
      args: { MODULE: shipping-service }
    environment:
      <<: *app-env
      DB_URL: jdbc:postgresql://postgres:5432/order_processing?currentSchema=shipping_service
      SERVER_PORT: 8080
    ports: ["8083:8080"]

  notification-service:
    <<: *app
    build:
      context: .
      args: { MODULE: notification-service }
    environment:
      <<: *app-env
      DB_URL: jdbc:postgresql://postgres:5432/order_processing?currentSchema=notification_service
      SERVER_PORT: 8080
    ports: ["8084:8080"]

volumes:
  postgres-data:
