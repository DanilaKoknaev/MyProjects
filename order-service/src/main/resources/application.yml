spring:
  application:
    name: order-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/order_processing?currentSchema=orders_service}
    username: ${DB_USER:orders}
    password: ${DB_PASSWORD:orders}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    table: flyway_orders_history
    schemas: orders_service
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      properties:
        enable.idempotence: true
        spring.json.type.mapping: "orderCreated:org.example.order.kafka.dto.OrderCreatedEvent"
    consumer:
      auto-offset-reset: earliest
      key-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.key.delegate.class: org.apache.kafka.common.serialization.StringDeserializer
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: org.example.order.kafka.dto
        spring.json.type.mapping: "paymentCompleted:org.example.order.kafka.dto.PaymentCompletedEvent,orderShipped:org.example.order.kafka.dto.OrderShippedEvent"
    listener:
      concurrency: ${KAFKA_CONSUMER_CONCURRENCY:3}
server:
  port: ${SERVER_PORT:8081}
management:
  endpoints.web.exposure.include: health,info,metrics
logging:
  pattern.level: "%5p [${spring.application.name:},%X{traceId:-}]"
